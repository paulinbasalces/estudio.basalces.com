<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Página não encontrada | Estúdio Basalces</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff5f3 0%, #fdf2f8 100%);
      color: #1a1a1a;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 560px; }
    .error-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      background: linear-gradient(135deg, #FF5841, #C53678);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -0.05em;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      margin-bottom: 16px;
      color: #1a1a1a;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #FF5841, #C53678);
      color: white;
      box-shadow: 0 4px 16px rgba(255, 88, 65, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 88, 65, 0.4);
    }
    .btn-secondary {
      background: white;
      color: #1a1a1a;
      border: 1px solid #e5e5e5;
    }
    .btn-secondary:hover {
      transform: translateY(-2px);
      border-color: #FF5841;
    }
    .illustration {
      font-size: 4rem;
      margin-bottom: 24px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <div class="illustration" aria-hidden="true">🔍</div>
    <div class="error-code" aria-hidden="true">404</div>
    <h1>Opa! Essa página não existe.</h1>
    <p>
      Parece que você seguiu um link quebrado ou digitou o endereço errado.
      Mas calma — a gente te ajuda a voltar pro caminho.
    </p>
    <div class="actions">
      <a href="index.html" class="btn btn-primary">
        ← Voltar ao site
      </a>
      <a href="https://wa.me/5531984470001" class="btn btn-secondary">
        💬 Falar no WhatsApp
      </a>
    </div>
  </main>
</body>
</html>
